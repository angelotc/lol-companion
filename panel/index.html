<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Companion</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="explore.css">
</head>
<body>
<div class="hdr"><div class="t" id="title">LoL Companion</div><span class="btns"><button class="x" id="gear" title="Settings">&#9881;</button></span></div>
<div class="tiers hidden" id="tiersBox"><div><div class="pill" id="tiers"></div></div></div>

<main class="screen" id="screen">
  <section class="sec" id="secStatus">
    <div class="empty" id="empty"><div class="dot"></div><div id="msg"></div><div class="sdetail" id="sdetail"></div></div>
  </section>

  <section class="sec hidden" id="secTeam">
    <div class="note hidden" id="note"></div>
    <div class="team" id="team">
      <div class="tside tally">
        <div><div class="rlabel">Allies</div><div class="row" id="allies"></div></div>
        <div class="bans" id="bansBox"><div class="rlabel">Bans</div><div class="row" id="bans"></div></div>
      </div>
      <div class="odds hidden" id="odds"></div>
      <div class="tside tenemy">
        <div><div class="rlabel">Enemies <span id="enemyHint"></span></div><div class="row" id="enemies"></div></div>
        <div class="dmg hidden" id="enemyDmg"></div>
        <div class="lanepick hidden" id="lanePick"></div>
      </div>
    </div>
  </section>

  <nav class="steps hidden" id="steps"></nav>

  <section class="sec hidden" id="secBans">
    <div class="sechrow"><span class="mxkey">Δ = how much your pick's win rate changes against it (red = it beats you) · small = shrunk by games, weighted by lane</span></div>
    <div class="mx" id="threats"></div>
  </section>

  <section class="sec hidden" id="secPicks">
    <div class="sechrow"><span class="mxkey" id="recKey"></span><div class="locked hidden" id="locked"></div></div>
    <div class="mx" id="recs"></div>
  </section>

  <section class="sec hidden" id="secBuild">
    <div class="bhead" id="bHead"></div>
    <div class="bbody" id="bBody"></div>
  </section>

  <section class="sec hidden" id="secExplore"></section>
</main>

<div class="foot" id="foot">Data: lolalytics &middot; last update --:--:-- &middot; <b>Ctrl+X</b> show/hide</div>
<script src="js/core.js"></script>
<script src="js/matrix.js"></script>
<script src="views/picks.js"></script>
<script src="views/bans.js"></script>
<script src="views/build.js"></script>
<script src="views/explore.js"></script>
<script src="views/client.js"></script>
<script src="js/demo.js"></script>
</body>
</html>
